apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnalgorithm-backend
  namespace: learnalgorithm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnalgorithm-backend
  template:
    metadata:
      labels:
        app: learnalgorithm-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrate
          image: learnalgorithm-backend:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: learnalgorithm-backend-config
            - secretRef:
                name: learnalgorithm-backend-secret
      containers:
        - name: backend
          image: learnalgorithm-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: learnalgorithm-backend-config
            - secretRef:
                name: learnalgorithm-backend-secret
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
