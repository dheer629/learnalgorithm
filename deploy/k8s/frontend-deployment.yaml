apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnalgorithm-frontend
  namespace: learnalgorithm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnalgorithm-frontend
  template:
    metadata:
      labels:
        app: learnalgorithm-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: frontend
          image: learnalgorithm-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://localhost:8000/api
            - name: SERVER_API_URL
              value: http://learnalgorithm-backend:8000/api
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
