apiVersion: v1
kind: Secret
metadata:
  name: learnalgorithm-backend-secret
  namespace: learnalgorithm
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://learnalgorithm:learnalgorithm@postgres:5432/learnalgorithm
  REDIS_URL: redis://redis:6379/0
  ADMIN_TOKEN: replace-with-a-local-admin-token
  POSTGRES_USER: learnalgorithm
  POSTGRES_PASSWORD: learnalgorithm
  POSTGRES_DB: learnalgorithm
