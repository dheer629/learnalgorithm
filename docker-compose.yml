services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-algolearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-algolearn}
      POSTGRES_DB: ${POSTGRES_DB:-algolearn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-algolearn} -d $${POSTGRES_DB:-algolearn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${IMAGE_REGISTRY:-}learnalgorithm-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      args:
        PIP_TRUSTED_HOST_ARGS: ${PIP_TRUSTED_HOST_ARGS:-}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-algolearn}:${POSTGRES_PASSWORD:-algolearn}@postgres:5432/${POSTGRES_DB:-algolearn}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token}
      PISTON_URL: ${PISTON_URL:-https://emkc.org/api/v2/piston/execute}
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - upstream-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: ${IMAGE_REGISTRY:-}learnalgorithm-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
        SERVER_API_URL: http://backend:8000/api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}/api
      SERVER_API_URL: http://backend:8000/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  upstream-data:
