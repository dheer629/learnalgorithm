[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = '''
/(
  \.pytest_cache
  | \.pytest_cache_local
  | \.pytest_tmp
  | \.ruff_cache
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--basetemp=.pytest_tmp"]
cache_dir = ".pytest_cache_local"
